# Tentmaker source registry. Data, not code.
#
# One entry per employer portal, verified by loading the employer's own careers page on
# 2026-10-05. Add entries with the /add-source skill.
#
# Fields
#   id        stable slug, unique
#   name      display name
#   kind      church-tech | ministry | health-sharing | finance | health-system | media |
#             publisher | business | university | adjacent
#   platform  a key of `platforms` below
#   key       what the adapter needs for this platform (see docs/platforms.md); omit if none
#   careers   the employer's own careers page (always present; this is the link we show)
#   board     the job-board URL, only when it cannot be built from platform + key
#   hq        "City ST" where known
#   work      remote | hybrid | onsite | mixed, as the employer states it; omit if unknown
#   dotnet    true when the employer's own postings or public code show a .NET stack
#   support_raised  true when most roles are funded by supporters the staff member recruits
#   robots    finding for THIS host: allowed | partial | disallowed | none | refused
#   phase     overrides the platform's phase for this one source
#   publish   unverified (default when absent) | cleared | blocked. Only the owner sets it.
#   note      one short line

platforms:
  greenhouse:      { phase: 1, method: "documented JSON API" }
  lever:           { phase: 1, method: "documented JSON API" }
  ashby:           { phase: 1, method: "documented JSON API" }
  pinpoint:        { phase: 1, method: "documented JSON endpoint" }
  gem:             { phase: 1, method: "documented JSON API" }
  smartrecruiters: { phase: 1, method: "documented JSON API, not yet exercised" }
  workday:         { phase: 2, method: "sitemap plus per-job JSON" }
  jobvite:         { phase: 2, method: "server-rendered HTML plus sitemap" }
  jazzhr:          { phase: 2, method: "server-rendered HTML" }
  icims:           { phase: 2, method: "server-rendered HTML with in_iframe=1" }
  rippling:        { phase: 2, method: "unofficial JSON" }
  adp-wfn:         { phase: 2, method: "unofficial JSON" }
  phenom:          { phase: 2, method: "sitemap plus job pages" }
  paylocity:       { phase: 2, method: "documented feed, key unconfirmed; else page JSON" }
  pageup:          { phase: 2, method: "reported server-rendered HTML" }
  hirebridge:      { phase: 2, method: "reported server-rendered HTML" }
  applicantpro:    { phase: 2, method: "reported JSON list" }
  html:            { phase: 2, method: "custom parser per site" }
  dayforce:        { phase: 3, method: "session with CSRF token" }
  ukg:             { phase: 3, method: "session; search path may be disallowed" }
  ukg-ready:       { phase: 3, method: "unknown" }
  brassring:       { phase: 3, method: "session with token" }
  adp-myjobs:      { phase: 3, method: "token from discovery call" }
  paycom:          { phase: 3, method: "unknown, assume browser" }
  unknown:         { phase: 3, method: "platform not identified yet" }
  none:            { phase: 0, method: "no job board; link only" }

